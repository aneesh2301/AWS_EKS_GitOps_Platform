apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ebs-csi-driver
  namespace: tooling
spec:
  interval: 1m
  path: ./infrastructure/networking/ebs-csi-driver
  prune: true
  sourceRef:
    kind: GitRepository
    name: tooling
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-runtime-values
  wait: true
  timeout: 5m