apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator
  namespace: tooling
spec:
  interval: 10m
  path: ./infrastructure/monitoring/grafana
  prune: true
  sourceRef:
    kind: GitRepository
    name: tooling
  wait: true
  dependsOn:
    - name: grafana-operator-crds