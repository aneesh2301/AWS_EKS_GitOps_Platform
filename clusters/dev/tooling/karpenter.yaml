apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: karpenter-controller
  namespace: tooling
spec:
  interval: 10m
  path: ./infrastructure/karpenter/
  prune: true
  sourceRef:
    kind: GitRepository
    name: tooling
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: karpenter-runtime-values
  dependsOn:
    - name: karpenter-crds
  wait: true
