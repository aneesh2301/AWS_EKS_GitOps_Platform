apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-crds
  namespace: tooling
spec:
  interval: 1m
  path: ./infrastructure/kyverno/kyverno-crds
  targetNamespace: tooling
  prune: false
  sourceRef:
    kind: GitRepository
    name: tooling
  wait: true
  timeout: 5m