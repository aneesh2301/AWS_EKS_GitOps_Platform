apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-crds
  namespace: tooling
spec:
  interval: 1m
  path: ./infrastructure/monitoring/monitoring-crds
  targetNamespace: monitoring
  prune: false
  sourceRef:
    kind: GitRepository
    name: tooling
  wait: true
  timeout: 5m