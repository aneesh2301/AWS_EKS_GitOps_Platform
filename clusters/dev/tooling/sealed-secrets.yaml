apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sealed-secrets
  namespace: tooling
spec:
  interval: 1m
  path: ./infrastructure/sealed-secrets/
  targetNamespace: tooling
  prune: true
  sourceRef:
    kind: GitRepository
    name: tooling
  wait: true
  timeout: 5m