apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: tooling
spec:
  interval: 30m

  releaseName: cert-manager
  targetNamespace: tooling
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.3"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: tooling
      interval: 1h

  values:
    crds:
      enabled: false
    replicaCount: 2
