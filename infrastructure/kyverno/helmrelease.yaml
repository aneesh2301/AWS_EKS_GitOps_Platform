apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: tooling
spec:
  interval: 1h

  dependsOn:
    - name: kyverno-crds

  chart:
    spec:
      chart: kyverno
      version: 3.9.1
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: tooling

  values:
    crds:
      install: false