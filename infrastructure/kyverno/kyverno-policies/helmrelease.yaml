apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: tooling
spec:
  interval: 30m

  chart:
    spec:
      chart: kyverno-policies
      version: 3.9.1
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: tooling

  dependsOn:
    - name: kyverno
      namespace: tooling

  values:
    podSecurityStandard: baseline
    validationFailureAction: Audit