apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: sample-dashboard
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: main-grafana
  json: |
    {
      "uid": "sample-dashboard",
      "title": "Kubernetes Monitoring - Example",
      "schemaVersion": 39,
      "version": 1,
      "panels": [],
      "time": {
        "from": "now-6h",
        "to": "now"
      }
    }
