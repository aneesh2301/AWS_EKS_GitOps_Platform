apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: monitoring
spec:
  interval: 10m
  releaseName: grafana-operator
  chart:
    spec:
      chart: grafana-operator
      version: "5.25.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-operator
        namespace: monitoring
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
