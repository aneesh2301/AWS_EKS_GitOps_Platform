apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: monitoring
spec:
  interval: 10m

  chart:
    spec:
      chart: mimir-distributed
      version: 5.8.0
      sourceRef:
        kind: HelmRepository
        name: grafana-mimir
        namespace: monitoring
      interval: 1h

  valuesFrom:
    - kind: ConfigMap
      name: mimir-values
      valuesKey: values.yaml

    # Keep chart configuration in values.yaml
    # This file is maintained alongside the HelmRelease.