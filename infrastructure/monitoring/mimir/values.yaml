minio:
  enabled: false

kafka:
  enabled: false

alertmanager:
  enabled: false

ruler:
  enabled: false


# Use classic architecture rather than ingest storage.
mimir:
  structuredConfig:
    ingest_storage:
      enabled: false
      kafka:
        address: null
        topic: null
        auto_create_topic_default_partitions: null
    distributor:
      remote_timeout: null
    ingester:
      push_grpc_method_enabled: null

    common:
      storage:
        backend: s3
        s3:
          endpoint: s3.us-east-1.amazonaws.com
          region: us-east-1

    blocks_storage:
      backend: s3
      storage_prefix: blocks
      s3:
        endpoint: s3.us-east-1.amazonaws.com
        region: us-east-1
        bucket_name: eks-dev-cluster-dev-observability

serviceAccount:
  create: true
  name: mimir
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::339712970776:role/eks-dev-cluster-dev-mimir-s3"

distributor:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingester:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistentVolume:
    enabled: true
    size: 1Gi
    storageClass: gp3

  zoneAwareReplication:
    enabled: false

store_gateway:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistentVolume:
    enabled: true
    size: 1Gi
    storageClass: gp3

compactor:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  persistentVolume:
    enabled: true
    size: 50Gi
    storageClass: gp3

query_frontend:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi

querier:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi

nginx:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

