apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-ebs-csi-driver
  namespace: kube-system
spec:
  interval: 30m
  releaseName: aws-ebs-csi-driver

  chart:
    spec:
      chart: aws-ebs-csi-driver
      version: "2.66.0"
      sourceRef:
        kind: HelmRepository
        name: aws-ebs-csi-driver
        namespace: tooling
      interval: 1h

  values:
    controller:
      serviceAccount:
        create: true
        name: ebs-csi-controller-sa
        annotations:
          eks.amazonaws.com/role-arn: "${EBS_CSI_IAM_ROLE_ARN}"

    node:
      serviceAccount:
        create: true
        name: ebs-csi-node-sa