apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-operator
  namespace: tooling
spec:
  interval: 30m

  chart:
    spec:
      chart: opentelemetry-operator
      version: 0.126.2
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: tooling
      interval: 1h

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    crds:
      create: false

    manager:
      collectorImage:
        repository: otel/opentelemetry-collector-k8s

    admissionWebhooks:
      certManager:
        enabled: true